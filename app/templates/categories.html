{% extends "base.html" %}

{% block content %}
<h2>Categories</h2>

<p>
    <a href="{{ url_for('add_category') }}">Add New Category</a>
</p>

{% if categories %}
    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>

        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>
                <a href="{{ url_for('edit_category', category_id=category.id) }}">Edit</a>

                <form method="POST" action="{{ url_for('delete_category', category_id=category.id) }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% else %}
    <p>No categories added yet.</p>
{% endif %}
{% endblock %}
