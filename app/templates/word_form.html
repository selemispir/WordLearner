{% extends "base.html" %}

{% block content %}
<h2>{{ title }}</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    <p>
        {{ form.english.label }}<br>
        {{ form.english() }}
    </p>

    <p>
        {{ form.russian.label }}<br>
        {{ form.russian() }}
    </p>

    <p>
        {{ form.example_sentence.label }}<br>
        {{ form.example_sentence() }}
    </p>

    <p>
        {{ form.submit() }}
    </p>
</form>

<p>
    <a href="{{ url_for('words') }}">Back to Words</a>
</p>
{% endblock %}
