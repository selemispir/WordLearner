{% extends "base.html" %}

{% block content %}
<h2>My Words</h2>

<p>
    <a href="{{ url_for('add_word') }}">Add New Word</a>
</p>

{% if words %}
    <table border="1" cellpadding="8">
        <tr>
            <th>English</th>
            <th>Russian</th>
            <th>Example</th>
            <th>Actions</th>
        </tr>

        {% for word in words %}
        <tr>
            <td>{{ word.english }}</td>
            <td>{{ word.russian }}</td>
            <td>{{ word.example_sentence }}</td>
            <td>
                <a href="{{ url_for('edit_word', word_id=word.id) }}">Edit</a>

                <form method="POST" action="{{ url_for('delete_word', word_id=word.id) }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% else %}
    <p>No words added yet.</p>
{% endif %}
{% endblock %}
